name: SyntaxCraft Studio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Test with the VS Code Extension Host
        run: env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET -u ELECTRON_OZONE_PLATFORM_HINT XDG_SESSION_TYPE=x11 xvfb-run -a npm run test:integration
      - run: npm run package
      - run: npm run verify:vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: syntaxcraft-studio-vsix
          path: release/*
          if-no-files-found: error
